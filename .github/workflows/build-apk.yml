name: Build Capacitor APK (Mori Core)

on:
  push:
    branches: [ "main", "master" ]
  workflow_dispatch:

jobs:
  build-android:
    runs-on: ubuntu-latest

    steps:
      # 1. Ambil source code dari repository
      - name: Checkout Repository
        uses: actions/checkout@v4

      # 2. Setup Node.js v18 (Sesuai dengan kebutuhan Capacitor/NPM)
      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 18
          cache: 'npm'

      # 3. Setup Java JDK 17 (Wajib untuk Gradle Android terbaru)
      - name: Setup Java JDK 17
        uses: actions/setup-java@v4
        with:
          distribution: 'zulu'
          java-version: '17'

      # 4. Install dependencies / package.json
      - name: Install NPM Dependencies
        run: npm install --legacy-peer-deps

      # 5. Sinkronisasi file dari folder public/ ke folder android/ via Capacitor
      - name: Capacitor Sync Android
        run: npx cap sync android

      # 6. Beri izin eksekusi Gradle & Build APK Debug
      - name: Build Android APK
        run: |
          cd android
          chmod +x gradlew
          ./gradlew assembleDebug

      # 7. Upload hasil file .apk sebagai Artifact agar bisa didownload
      - name: Upload APK Result
        uses: actions/upload-artifact@v4
        with:
          name: Mori-Kalkulator-APK
          path: android/app/build/outputs/apk/debug/app-debug.apk
          
