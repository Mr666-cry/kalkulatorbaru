name: Build Capacitor APK (Mori Core)

on:
  push:
    branches: [ "main", "master" ]
  workflow_dispatch:

jobs:
  build-android:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout Repository
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: 'npm'

      # Upgrade ke Java JDK 21 untuk Gradle 8+
      - name: Setup Java JDK 21
        uses: actions/setup-java@v4
        with:
          distribution: 'zulu'
          java-version: '21'

      - name: Install NPM Dependencies
        run: npm install --legacy-peer-deps

      - name: Capacitor Sync Android
        run: npx cap sync android

      # Build APK dengan opsi stacktrace agar jelas jika ada isu
      - name: Build Android APK
        run: |
          cd android
          chmod +x gradlew
          ./gradlew assembleDebug --stacktrace

      - name: Upload APK Result
        uses: actions/upload-artifact@v4
        with:
          name: Mori-Kalkulator-APK
          path: android/app/build/outputs/apk/debug/app-debug.apk
          
